<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1a55a0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="배구대회">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="config.js?v=1"></script>
</head>
<body>
<title>학교 배구대회 운영판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* Layout: court-blue scoreboard header with scrolling tabs; one working column up to 1160px; times set large and bold so schedules scan at a glance */
:root{
  --bg:#eef1f5; --surface:#ffffff; --sunk:#e6ebf2; --ink:#131c2b; --muted:#566376; --line:#cfd7e2;
  --court:#1a55a0; --court-soft:#e0eaf8; --on-court:#ffffff;
  --ball:#f2b200; --ball-soft:#fff4d1; --ball-ink:#6b4e00;
  --live:#cf3b24; --live-soft:#fde4df; --ok:#137a4a; --ok-soft:#dbf1e4; --on-ok:#ffffff;
  --f-body:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e141d; --surface:#161f2c; --sunk:#1d2939; --ink:#e8edf4; --muted:#9dabbd; --line:#2e3b4d;
  --court:#74aaf3; --court-soft:#1b2c45; --on-court:#0b1220;
  --ball:#f5c84a; --ball-soft:#3a3016; --ball-ink:#f5d57a;
  --live:#ff7c65; --live-soft:#3d1f1a; --ok:#52c78d; --ok-soft:#173327; --on-ok:#06210f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e141d; --surface:#161f2c; --sunk:#1d2939; --ink:#e8edf4; --muted:#9dabbd; --line:#2e3b4d;
  --court:#74aaf3; --court-soft:#1b2c45; --on-court:#0b1220;
  --ball:#f5c84a; --ball-soft:#3a3016; --ball-ink:#f5d57a;
  --live:#ff7c65; --live-soft:#3d1f1a; --ok:#52c78d; --ok-soft:#173327; --on-ok:#06210f; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;font-weight:700}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--court);color:var(--on-court);border-bottom:4px solid var(--ball)}
.top-in{max-width:1160px;margin:0 auto;padding:14px 16px 0}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-weight:800;font-size:clamp(19px,3vw,25px);margin:0;letter-spacing:-.01em;text-wrap:balance}
.brand small{opacity:.85;font-size:13px}
.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;color:var(--on-court);opacity:.8;padding:9px 13px 11px;font-weight:700;white-space:nowrap;cursor:pointer;border-radius:8px 8px 0 0}
.tab[aria-current="page"]{opacity:1;background:var(--bg);color:var(--ink)}
.tab:focus-visible,.btn:focus-visible,.chip:focus-visible,.mcard:focus-visible,.slot:focus-visible,.mbox:focus-visible{outline:3px solid var(--ball);outline-offset:2px}
main{max-width:1160px;margin:0 auto;grid-template-columns:minmax(0,1fr);padding-inline:16px;padding-block:20px 60px;display:grid;gap:18px}
.banner{background:var(--ball-soft);color:var(--ball-ink);border:1px solid var(--ball);border-radius:10px;padding:10px 14px;font-size:14px}
.banner b{font-weight:800}
.hint{background:var(--court-soft);border-radius:10px;padding:10px 14px;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.notice{background:var(--court-soft);border-radius:10px;padding:12px 14px;white-space:pre-wrap}
@media (max-width:640px){.notice{padding:9px 52px 9px 12px;font-size:14px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;cursor:pointer;position:relative}.notice.open{white-space:pre-wrap}.notice::after{content:'더보기';position:absolute;right:10px;top:9px;font-size:12px;font-weight:700;color:var(--court)}.notice.open::after{content:'접기'}}
@media (max-width:760px){.tabs{-webkit-mask-image:linear-gradient(90deg,#000 88%,rgba(0,0,0,.35));mask-image:linear-gradient(90deg,#000 88%,rgba(0,0,0,.35))}}
.panel{--pp:18px;grid-template-columns:minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:14px;min-width:0}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
h2{font-weight:800;font-size:21px;margin:0;letter-spacing:-.01em}
h3{font-size:16px;margin:0;font-weight:800}
.sub{color:var(--muted);margin:2px 0 0;font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;cursor:pointer;font-weight:700;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cnt{font-size:12px;background:var(--sunk);color:var(--ink);border-radius:999px;padding:0 7px;font-weight:700}
.chip[aria-pressed="true"] .cnt{background:var(--ball);color:#1b1400}
.seg{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:10px;width:max-content;max-width:100%;overflow-x:auto}
.seg button{border:0;background:none;padding:7px 12px;border-radius:7px;font-weight:700;cursor:pointer;white-space:nowrap;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer}
.btn.primary{background:var(--court);color:var(--on-court);border-color:var(--court)}
.btn.warn{color:var(--live);border-color:var(--live)}
.btn.small{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:top}
th{background:var(--sunk);font-size:12px;color:var(--muted);font-weight:700}
tr:last-child td{border-bottom:0}
.empty{color:var(--muted);text-align:center;padding:28px 12px;border:1px dashed var(--line);border-radius:10px}
.pill{display:inline-flex;gap:5px;align-items:center;font-size:12px;font-weight:800;border-radius:999px;padding:2px 9px;white-space:nowrap}
.pill.live{background:var(--live);color:#fff}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.wait{background:var(--sunk);color:var(--muted)}
.pill.draft{background:var(--ball-soft);color:var(--ball-ink)}
form.grid{display:grid;gap:14px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
label.f{display:grid;gap:4px;font-size:13px;font-weight:700;color:var(--muted)}
fieldset{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0;display:flex;gap:6px 14px;flex-wrap:wrap}
legend{font-size:13px;font-weight:700;color:var(--muted);padding:0 4px}
fieldset label{display:inline-flex;gap:5px;align-items:center;font-size:14px}
input[type=text],input[type=password],input[type=tel],input[type=number],input[type=time],input[type=datetime-local],select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;color:var(--ink);font-weight:500}
textarea{min-height:90px;resize:vertical}
.players{display:grid;gap:6px}
.prow{display:grid;grid-template-columns:22px minmax(0,1fr) 92px 84px 32px;gap:6px;align-items:center;min-width:0}
.prow input,.prow select{padding:6px 8px}
.prow .icon-btn{height:32px}
#prows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(9,auto);grid-auto-flow:column;gap:5px 32px}
@media (max-width:640px){#prows{gap:4px 8px}.prow{grid-template-columns:15px minmax(0,1fr) 38px 34px;gap:3px}.prow .icon-btn{display:none}.prow input,.prow select{padding:5px 4px;font-size:13px}.prow .pno{font-size:11px}.prow select{padding-right:0}}
.pno{color:var(--muted);text-align:right;font-weight:700}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;height:36px;cursor:pointer}
.consent{background:var(--sunk);border-radius:10px;padding:12px 14px;font-size:13px;display:grid;gap:6px}
.err{color:var(--live);font-weight:700;margin:0;min-height:1em}
.meta{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:14px;color:var(--muted);align-items:center}
.meta b{color:var(--ink)}
.t-big{font-weight:800;color:var(--court);font-variant-numeric:tabular-nums}
.shift{font-size:12px;font-weight:800;white-space:nowrap}
.shift.early{color:var(--ok)}.shift.late{color:var(--live)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){.dot{animation:none}}
/* bracket with connector lines */
.bracket-wrap{overflow-x:auto;padding-bottom:6px}
.bk-heads{display:flex;margin-bottom:8px}
.bk-heads div{flex:none;text-align:center;font-size:13px;font-weight:800;color:var(--muted)}
.bk{position:relative}
.bk svg{position:absolute;inset:0;overflow:visible}
.ln{fill:none;stroke:var(--line);stroke-width:2}
.ln.win{stroke:var(--ok);stroke-width:3}
.mbox{position:absolute;height:72px;border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden;font-size:12.5px;display:grid;grid-template-rows:22px 25px 25px}
.mbox.clk{cursor:pointer}
.mbox.clk:hover{border-color:var(--court)}
.mbox.live{border:2px solid var(--live)}
.mbox.up,.vbox.up{border:2px solid var(--court)}
.mbox.up.tbd2,.vbox.up.tbd2{border:1.5px dashed var(--court)}
.mbox.done,.vbox.done{opacity:.5;border-color:var(--line)}
.mbox.done:hover,.vbox.done:hover{opacity:.85}
.slot.champ-s,.vsl.champ-s{background:var(--ball-soft)!important;color:var(--ball-ink)!important;font-weight:900}
.mbox.ready,.vbox.ready,.mcard.ready{border:2px solid var(--ball)}
.mbox.final,.mbox.final.up,.mbox.final.up.tbd2{border:2px solid var(--ball)}
.drop{display:grid;gap:4px;place-items:center;text-align:center;border:2px dashed var(--court);border-radius:12px;padding:22px 14px;background:var(--court-soft);cursor:pointer;color:var(--court)}
.drops{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.drop.photo{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.drop.over{background:var(--ball-soft);border-color:var(--ball)}
.imp-list{display:grid;gap:10px}
.imp-card{border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:10px;padding:12px 14px;display:grid;gap:6px}
.imp-card.bad{border-left-color:var(--ball)}
.xl-box{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap;background:var(--sunk);border-radius:10px;padding:12px 14px}
.dl{font-size:.68em;font-weight:800;background:var(--ball-soft);color:var(--ball-ink);border-radius:4px;padding:0 3px;margin-right:2px;vertical-align:1px}
.tt-day{font-size:12px;font-weight:800;color:var(--muted);margin:10px 0 4px;letter-spacing:.02em}
.tt-item.cur{border-left:4px solid var(--court)}
.sch-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 18px}
.sch.hd{border-bottom:2px solid var(--ink);padding-block:4px;font-size:12px;font-weight:800;color:var(--muted)}
.sch.hd b{color:var(--muted);font-size:12px}
@media (max-width:520px){.sch-grid{gap:0 10px}.sch{gap:3px;padding:7px 0;font-size:13px}.sch .i{display:none}.sch .n{font-size:11px}}
.sch{display:flex;align-items:center;gap:8px;padding:8px 4px;border-bottom:1px solid var(--line);min-width:0}
.sch .i{color:var(--muted);font-weight:700;min-width:20px;text-align:right;font-size:13px}
.sch b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sch .n{color:var(--muted);font-size:13px;white-space:nowrap}
.rv{display:grid;gap:6px}.rv-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.rv b.me{color:var(--court);background:var(--court-soft);border-radius:5px;padding:0 5px}
.mine-item{cursor:pointer}.mine-item:hover{border-color:var(--court)}
.ref-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sref-list{display:grid;gap:4px;font-size:13px;background:var(--ball-soft);border-radius:8px;padding:8px 10px}
.off-tag{background:var(--live-soft);color:var(--live);border-radius:5px;padding:0 6px;font-size:12px;font-weight:800}
.nohelp .sec-head .sub,.nohelp .bk-legend,.nohelp .help{display:none!important}
.ttbox{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tt-toggle{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;background:var(--sunk);border:0;cursor:pointer;font-weight:800;font-size:15px}
.tt-body{padding:12px 14px}
.bk-legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);align-items:center}
.bk-legend i{display:inline-block;width:18px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px;background:var(--surface)}
main.wide{max-width:none}

.mhead{display:flex;justify-content:space-between;align-items:center;gap:4px;padding:0 7px;background:var(--sunk);font-size:10.5px;color:var(--muted);font-weight:700;white-space:nowrap;overflow:hidden}
.mhead .t-big{font-size:13px}
.mhead .shift{font-size:10px}
.mhead .row{flex-wrap:nowrap}
.mhead>*:first-child{flex-shrink:0}.mhead>*:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis}
.mbox.live .mhead{background:var(--live);color:#fff}
.mbox.live .mhead .t-big{color:#fff}
.slot{display:flex;align-items:center;gap:5px;padding:0 7px;border-top:1px solid var(--line);font-weight:500;min-width:0}
.slot .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pts{display:flex;gap:3px;font-size:10.5px;color:var(--muted);font-weight:500}
.pts i{font-style:normal;display:inline-block;width:1.3em;text-align:right;font-variant-numeric:tabular-nums}
.pts i.w{color:var(--ink);font-weight:800}
.slot b{min-width:10px;text-align:right}
.slot.win{font-weight:800;background:var(--ok-soft);color:var(--ok)}
.slot.tbd{color:var(--muted)}
.slot.pick{cursor:pointer}
.slot.pick:hover{background:var(--court-soft)}
.slot.sel{outline:2px solid var(--ball);outline-offset:-2px;background:var(--ball-soft)}
.champ{display:flex;gap:10px;align-items:center;background:var(--ball-soft);border:1px solid var(--ball);border-radius:10px;padding:10px 14px;color:var(--ball-ink);font-weight:700}
.champ b{font-size:19px;font-weight:800;color:var(--ink)}
.dtabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.dtab{border:1.5px solid var(--line);background:var(--sunk);border-radius:10px;padding:7px 4px;font:inherit;font-weight:800;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--ink)}
.dtab small{font-weight:600;font-size:11px;color:var(--muted)}
.dtab.on{background:var(--court);border-color:var(--court);color:#fff}.dtab.on small{color:#dfe8f6}
.dpane{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:10px}
.dpane[hidden]{display:none}
.tcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;align-items:start}
.tcol h4{margin:0 0 6px;font-size:15px}
.tlist{display:grid;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.trow{display:grid;grid-template-columns:20px minmax(0,1fr) auto auto;grid-template-areas:"i s t n" "i s p n";column-gap:8px;align-items:center;text-align:left;font:inherit;background:var(--surface);border:0;border-top:1px solid var(--line);padding:5px 10px;cursor:pointer;color:var(--ink)}
.trow:first-child{border-top:0}.trow:hover{background:var(--court-soft)}
.trow .rti{grid-area:i;font-size:11px;color:var(--muted);font-weight:700}
.trow b{grid-area:s;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .rtt{grid-area:t;font-size:12px;color:var(--muted);text-align:right}
.trow .rtp{grid-area:p;font-size:11.5px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.trow .rtn{grid-area:n;font-size:12px;font-weight:800;color:var(--court);min-width:30px;text-align:right}
.tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
.tbox{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:8px;align-content:start}
.trange{display:flex;align-items:center;gap:5px;flex-wrap:wrap}.trange span{font-size:14px;color:var(--muted);white-space:nowrap;flex-shrink:0}
.trange select.tsel,select.tsel{width:86px!important;min-width:0!important;flex:0 0 auto;padding:6px 8px}
#e-exday{width:auto!important;justify-self:start}
.trange{flex-wrap:nowrap!important}

/* ---------- 휴대폰 (가로 760px 이하): 아래쪽 메뉴, 작은 머리글 ---------- */
.bnav{display:none}
@media (max-width:760px){
  header.top .tabs{display:none}
  .top-in{padding:10px 16px 9px}
  .brand h1{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  header.top{border-bottom-width:3px}
  main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))!important;padding-top:12px!important;gap:12px!important}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:4px 2px calc(4px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 14px rgba(19,28,43,.08)}
  .bnav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 0 4px;font-size:11.5px;font-weight:700;color:var(--muted);cursor:pointer;border-radius:10px;min-height:54px;justify-content:center}
  .bnav .bi{font-size:21px;line-height:1.1;filter:grayscale(1);opacity:.75}
  .bnav button[aria-current=page]{color:var(--court);background:var(--court-soft)}
  .bnav button[aria-current=page] .bi{filter:none;opacity:1}
  .only-desk{display:none!important}
  .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -4px;padding:0 4px 2px}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;padding:7px 12px}
  .panel{padding:14px!important}
  #toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))!important}
}
.morelist{display:grid;gap:8px}
.morelist button{display:grid;gap:2px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:13px 14px;cursor:pointer;font:inherit;color:var(--ink)}
.morelist b{font-size:16px}.morelist span{font-size:13px;color:var(--muted)}

@media (max-width:760px){
  .chips{width:100%;flex:1 1 100%;display:grid!important;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;overflow:visible!important;margin:0!important;padding:0!important}
  .chip{padding:7px 2px!important;font-size:13.5px;gap:3px;justify-content:center;min-width:0;white-space:nowrap}
  .chip .cnt{font-size:11px;padding:0 5px}
  .vlegend{flex-wrap:nowrap;gap:8px;font-size:11px;overflow:hidden;white-space:nowrap}
  .vlegend span:last-child{display:none}
  .sec-head{flex-wrap:nowrap!important}
  .seg{width:100%}.seg button{flex:1 1 auto;padding:6px 4px!important;font-size:12px!important}
  .btn{padding:8px 10px;font-size:13.5px}.btn.small{padding:6px 9px;font-size:12.5px}
  .row{gap:6px}

const hm=s=>{if(!s)return null;const[h,m]=s.split(':').map(Number);return h*60+m};
const mask=s=>{s=String(s||'');return s?s[0]+'*'.repeat(Math.max(1,s.length-1)):''};

  try{const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+':'+pw));return [...new Uint8Array(d)].map(b=>b.toString(16).padStart(2,'0')).join('')}
  catch(e){let h=2166136261;for(const c of salt+':'+pw){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return 'f'+(h>>>0).toString(16)}
}

  const blob=new Blob([data],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});

function adminMerge(o){
  if(JSON.stringify(coreOf())===SV.core){applyCore(o.core);SV.core=JSON.stringify(coreOf())}

  const body={token:SV.token},snap={teams:{},staff:{}};let n=0;
  const c=JSON.stringify(coreOf());if(c!==SV.core){body.core=JSON.parse(c);snap.core=c;n++}
  for(const kind of['teams','staff']){body[kind]={};const seen=new Set();
    for(const x of S[kind]){seen.add(x.id);const j=JSON.stringify(x);if(SV[kind][x.id]!==j){body[kind][x.id]=JSON.parse(j);snap[kind][x.id]=j;n++}}
    for(const id of Object.keys(SV[kind]))if(!seen.has(id)){body[kind][id]=null;snap[kind][id]=null;n++}}
  if(!n)return;
  pushing=true;setSync('저장 중…');
  try{const r=await api('adminSave',body);
    if(snap.core)SV.core=snap.core;
    for(const kind of['teams','staff'])for(const id in snap[kind]){if(snap[kind][id]===null)delete SV[kind][id];else SV[kind][id]=snap[kind][id]}
    for(const t of S.teams)if(t.newPw){delete t.newPw;if(SV.teams[t.id])SV.teams[t.id]=JSON.stringify(t)}

  finally{pushing=false;if(pushAgain){pushAgain=false;adminPush()}}
}

function pushShared(){
  if(!DB||!dbReady||dbRO)return;
  const jobs=[];
  const c=JSON.stringify(coreOf());if(c!==synced.core){synced.core=c;const body=JSON.parse(c);jobs.push({run:()=>DB.doc('core/main').set(body),undo:()=>{if(synced.core===c)synced.core=null}})}
  for(const kind of['teams','staff']){
    const seen=new Set();
    for(const x of S[kind]){seen.add(x.id);const j=JSON.stringify(x);if(synced[kind][x.id]!==j){synced[kind][x.id]=j;const body=JSON.parse(j);jobs.push({run:()=>DB.collection(kind).doc(x.id).set(body),undo:()=>{if(synced[kind][x.id]===j)delete synced[kind][x.id]}})}}
    for(const id of Object.keys(synced[kind]))if(!seen.has(id)){const old=synced[kind][id];delete synced[kind][id];jobs.push({run:()=>DB.collection(kind).doc(id).delete(),undo:()=>{if(!(id in synced[kind]))synced[kind][id]=old}})}
  }
  if(jobs.length>3)setSync(`저장 중… (${jobs.length}건)`);
  for(const job of jobs)dbChain=dbChain.then(()=>runJob(job));
  dbChain=dbChain.then(()=>setSync(''));
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let retryTimer=null;
async function runJob(job){
  for(let t=0;t<6;t++){
    try{await job.run();await sleep(40);return}
    catch(e){const c=e&&e.code;
      if(c==='invalid_argument'){job.undo();if(!dbRO){dbRO=true;toast('이 계정은 보기 권한만 있어요. 바꾼 내용은 저장되지 않아요.')}return}
      if(c==='quota_exceeded'){job.undo();toast('저장 공간이 가득 찼어요.');return}
      if(c==='revoked'||c==='not_granted'||c==='capability_disabled'){job.undo();return}
      await sleep(600*(t+1)+Math.random()*400)}
  }
  job.undo();toast('저장이 늦어지고 있어요. 잠시 뒤 자동으로 다시 저장해요.');
  clearTimeout(retryTimer);retryTimer=setTimeout(pushShared,8000);
}

/* ---------- bracket logic ---------- */
const byId=(br,id)=>id?br.matches.find(m=>m.id===id)||null:null;
const teamName=id=>{const t=S.teams.find(x=>x.id===id);return t?t.school:'기권'};
const alive=id=>S.teams.some(t=>t.id===id);
const started=m=>!!(m.actStart||m.winner);
function winnerOf(m){return m?(m.winner||m.wo||null):null}
function roundName(br,r){return (br.names&&br.names[r])||''}
function resolve(br){
  for(const m of br.matches.slice().sort((x,y)=>x.r-y.r)){
    const fa=byId(br,m.fa),fb=byId(br,m.fb);
    const gA=m.ta?!alive(m.ta):!!(fa&&fa.dead),gB=m.tb?!alive(m.tb):!!(fb&&fb.dead);
    m.a=m.ta?(gA?null:m.ta):winnerOf(fa);m.b=m.tb?(gB?null:m.tb):winnerOf(fb);
    m.goneA=gA;m.goneB=gB;m.dead=gA&&gB;
    m.wo=!m.winner&&gA!==gB?(gA?m.b:m.a)||null:null;
    if(m.winner&&m.winner!==m.a&&m.winner!==m.b){m.winner=null;m.sets=[];m.sa=m.sb=0;m.actStart=m.actEnd=null}
  }
}
// 화면 배치: mirror = 양쪽에서 가운데로, single = 한쪽 방향
function place(br,mode){
  const fin=br.matches.reduce((x,y)=>y.r>x.r?y:x),R=br.rounds,P={},leaf={L:0,R:0};
  const lay=(m,side)=>{const ch=[m.fa,m.fb].map(id=>byId(br,id)).filter(Boolean);let y;
    if(!ch.length)y=leaf[side]++;else{const ys=ch.map(c=>lay(c,side));y=ys.reduce((a,b)=>a+b,0)/ys.length}
    P[m.id]={side,y};return y};
  let rows,cols;
  if(mode==='mirror'&&fin.fa&&fin.fb){
    lay(byId(br,fin.fa),'L');lay(byId(br,fin.fb),'R');
    rows=Math.max(leaf.L,leaf.R);const off={L:(rows-leaf.L)/2,R:(rows-leaf.R)/2};
    for(const id in P)P[id].y+=off[P[id].side];
    P[fin.id]={side:'C',y:(P[fin.fa].y+P[fin.fb].y)/2};cols=2*(R-1)+1;
  }else{lay(fin,'L');rows=leaf.L;cols=R}
  for(const m of br.matches)P[m.id].col=P[m.id].side==='R'?cols-1-m.r:m.r;
  return{P,rows:Math.max(rows,1),cols,mirror:cols>R};
}
function number(br){
  const{P}=place(br,'mirror'),o={L:0,C:1,R:2};let k=0;
  for(const m of br.matches.slice().sort((x,y)=>x.r-y.r||o[P[x.id].side]-o[P[y.id].side]||P[x.id].y-P[y.id].y)){m.no=++k}
}
/* ---------- 통합 일정: 모든 종별이 1·2코트를 함께 쓰고, 2일 동안 진행 ---------- */
function schedCfg(){if(!S.settings.sched)S.settings.sched={days:['2026-10-17','2026-10-18'],start:'08:30',end:'',lunchFrom:'',lunchTo:'',avg:40,gap:10};if(S.settings.sched.gap==null)S.settings.sched.gap=0;return S.settings.sched}
// 날짜마다 시작·끝·점심을 따로 (없으면 공통 값)
function dayCfg(i){const c=schedCfg(),o=(c.dayCfg||[])[i]||{};return{start:o.start||c.start||'08:30',end:o.end!=null?o.end:(c.end||''),lunchFrom:o.lunchFrom!=null?o.lunchFrom:(c.lunchFrom||''),lunchTo:o.lunchTo!=null?o.lunchTo:(c.lunchTo||'')}}
function dayWin(){const c=schedCfg();return c.days.filter(Boolean).map((d,i)=>{const k=dayCfg(i);return{d,s:Date.parse(d+'T'+k.start),e:k.end?Date.parse(d+'T'+k.end):Infinity,ls:k.lunchFrom&&k.lunchTo?Date.parse(d+'T'+k.lunchFrom):null,le:k.lunchFrom&&k.lunchTo?Date.parse(d+'T'+k.lunchTo):null}})}
function fitSlot(t,dur,W){for(const w of W){let x=Math.max(t,w.s);if(w.ls!=null&&w.le!=null&&x>=w.ls&&x<w.le)x=w.le;if(x+dur<=w.e+5*60000)return x}return W.length?Math.max(t,W[W.length-1].s):t}
const dayKey=ms=>{const d=new Date(ms);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
function dayIdx(ms){return schedCfg().days.indexOf(dayKey(ms))}
function dayName(ms){const i=dayIdx(ms);return i>=0?`${i+1}일차`:fmtD(ms)}
function tLabel(ms){return (dayIdx(ms)>0?`<small class="dl">${dayIdx(ms)+1}일</small>`:'')+fmtT(ms)}
function prioList(){
  const di=Object.fromEntries(DIVS.map(([k],i)=>[k,i])),L=[];
  for(const[d]of DIVS){const br=S.brackets[d];if(!br)continue;const cnt={};
    for(const m of br.matches.slice().sort((a,b)=>(a.no||0)-(b.no||0))){const dep=br.rounds-1-m.r;cnt[dep]=(cnt[dep]||0)+1;L.push({d,br,m,dep,w:cnt[dep]})}}
  return L.sort((a,b)=>b.dep-a.dep||a.w-b.w||di[a.d]-di[b.d]);
}
function scheduleAll(){
  if(!S)return;
  const W=dayWin(),avg=schedCfg().avg*60000,gap=(schedCfg().gap||0)*60000,now=Date.now();
  const all={};for(const[d]of DIVS){const br=S.brackets[d];if(!br)continue;resolve(br);for(const m of br.matches)all[d+':'+m.id]={d,br,m}}
  if(!S.plan||!S.plan.seq)S.plan={seq:{}};const seq=S.plan.seq;
  for(const c of Object.keys(seq))if(!COURTS.includes(c)){(seq[COURTS[0]]=seq[COURTS[0]]||[]).push(...seq[c]);delete seq[c]}
  COURTS.forEach(c=>{if(!seq[c])seq[c]=[]});
  const have=new Set();for(const c of COURTS)seq[c]=seq[c].filter(k=>all[k]&&!have.has(k)&&(have.add(k),true));
  for(const x of prioList()){const k=x.d+':'+x.m.id;if(!have.has(k)){const c=COURTS.slice().sort((a,b)=>seq[a].length-seq[b].length)[0];seq[c].push(k);have.add(k)}}
  const start0=W.length?W[0].s:now,free={},end={},ptr={};COURTS.forEach(c=>{free[c]=start0;ptr[c]=0});
  for(let g=0;g<5000;g++){
    let pick=null;
    for(const c of COURTS){const k=seq[c][ptr[c]];if(!k)continue;const m=all[k].m,fs=[m.fa,m.fb].filter(Boolean);
      const ready=fs.every(f=>end[f]!=null);let dep=start0;for(const f of fs)if(end[f]!=null)dep=Math.max(dep,end[f]+gap);
      const dk=S.plan.day&&S.plan.day[k];if(dk!=null&&W[dk])dep=Math.max(dep,W[dk].s);
      const cand={c,k,ready,dep,s:m.actStart||Math.max(free[c],dep)};
      if(!pick||(cand.ready&&!pick.ready)||(cand.ready===pick.ready&&cand.s<pick.s))pick=cand}
    if(!pick)break;
    const m=all[pick.k].m;ptr[pick.c]++;m.court=pick.c;
    if((m.wo||m.dead)&&!m.winner){m.est=pick.dep;m.estEnd=pick.dep;end[m.id]=pick.dep;continue}
    let st,en;
    if(m.actStart){st=m.actStart;en=m.actEnd||Math.max(m.actStart+avg,(now>m.actStart+avg&&now-m.actStart<6*3600000)?now:0)}
    else{st=fitSlot(Math.max(free[pick.c],pick.dep),avg,W);en=st+avg}
    m.est=st;m.estEnd=en;end[m.id]=en;free[pick.c]=Math.max(free[pick.c],en+gap);
  }
}
function schedule(){scheduleAll()}
function overflow(){const W=dayWin();if(!W.length||W[W.length-1].e===Infinity)return[];const last=W[W.length-1].e,out=[];for(const[d]of DIVS){const br=S.brackets[d];if(br)for(const m of br.matches)if(!m.winner&&!m.wo&&!m.dead&&m.estEnd>last)out.push({d,m})}return out}
function overflowBanner(){if(!ui.admin)return '';const o=overflow();if(!o.length)return '';const W=dayWin();
  return `<div class="banner"><b>⚠ ${o.length}경기가 마지막 날 종료 시각(${fmtT(W[W.length-1].e)})을 넘어가요.</b> 마지막 경기 예상 종료 ${fmtT(Math.max(...o.map(x=>x.m.estEnd)))}. [대회 일정 설정]에서 끝나는 시각을 늦추거나, 경기 시간·쉬는 시간을 줄이거나, 날짜를 하루 늘려 주세요.</div>`}
// 결과가 저장되면 그 코트(와 이어지는 코트)의 다음 경기를 자동으로 시작: 앞 경기가 끝났고 두 팀이 정해진 경우
const isReady=m=>!!(m.ready&&!m.actStart&&!m.winner);
// 결과가 저장되면 같은 코트의 다음 경기를 '준비 중'으로 올림. 실제 시작은 관리자가 [경기 시작]을 눌러 기록
function autoStartNext(){
  const all={};for(const[d]of DIVS){const b=S.brackets[d];if(b)for(const m of b.matches)all[d+':'+m.id]={d,m}}
  for(const x of Object.values(all))if(x.m.ready&&(x.m.actStart||x.m.winner))delete x.m.ready;
  if(S.settings.autoStart===false){for(const x of Object.values(all))delete x.m.ready;return []}
  scheduleAll();const out=[];
  for(const c of COURTS){const seq=(S.plan.seq[c]||[]).map(k=>all[k]).filter(x=>x&&!((x.m.wo||x.m.dead)&&!x.m.winner));
    const i=seq.findIndex(x=>!x.m.actStart&&!x.m.winner);
    let ok=null;
    if(i>0&&!seq.some(x=>isLive(x.m))){const prev=seq[i-1].m,nx=seq[i];if(prev.winner&&nx.m.a&&nx.m.b&&dayIdx(nx.m.est)===dayIdx(prev.actEnd||prev.estEnd))ok=nx}
    for(const x of seq)if(x!==ok&&x.m.ready&&!x.m.actStart)delete x.m.ready;
    if(ok){if(!ok.m.ready)out.push(ok);ok.m.ready=true}}
  return out;
}
function anyStarted(){return Object.values(S.brackets).some(br=>br.matches.some(started))}
function renumber(br){br.matches.slice().sort((a,b)=>(a.est-b.est)||(COURTS.indexOf(a.court)-COURTS.indexOf(b.court))).forEach((m,i)=>m.no=i+1)}
// 처음부터 일정을 짬: 결승에서 먼 경기부터, 종별을 번갈아 가며, 먼저 비는 코트에 넣음
function buildPlan(){
  const W=dayWin(),avg=schedCfg().avg*60000,gap=(schedCfg().gap||0)*60000,start0=W.length?W[0].s:Date.now();
  const seq={},free={},end={};COURTS.forEach(c=>{seq[c]=[];free[c]=start0});
  const PL=prioList(),split=W.length>1&&W.some(w=>w.e===Infinity),per=Math.ceil(PL.length/Math.max(1,W.length)),dayOf={};
  PL.forEach((x,i)=>{if(split)dayOf[x.d+':'+x.m.id]=Math.min(W.length-1,Math.floor(i/per))});
  for(const x of PL){let dep=start0;for(const f of[x.m.fa,x.m.fb])if(f&&end[f]!=null)dep=Math.max(dep,end[f]+gap);
    const dk=dayOf[x.d+':'+x.m.id];if(dk!=null)dep=Math.max(dep,W[dk].s);
    let best=null;for(const c of COURTS){let st=fitSlot(Math.max(free[c],dep),avg,W);const w=W.find(w=>w.ls!=null&&st<w.ls&&st+avg>w.ls);if(w)st=fitSlot(w.le,avg,W);if(!best||st<best.st)best={c,st}}
    seq[best.c].push(x.d+':'+x.m.id);end[x.m.id]=best.st+avg;free[best.c]=best.st+avg+gap}
  S.plan={seq,day:dayOf};scheduleAll();
  for(const br of Object.values(S.brackets)){renumber(br);br.matches.forEach(m=>m.plan=m.est)}
}
// 대진표가 바뀐 뒤: 아직 시작한 경기가 없으면 처음부터, 있으면 새 경기만 뒤에 붙임
function replan(){
  if(!anyStarted()){buildPlan();return}
  scheduleAll();
  for(const br of Object.values(S.brackets)){if(!br.matches.some(started))renumber(br);br.matches.forEach(m=>{if(m.plan==null)m.plan=m.est})}
}
function moveCourt(d,m,c){
  if(m.court===c)return;const k=d+':'+m.id,seq=S.plan.seq;
  for(const x of COURTS)seq[x]=seq[x].filter(y=>y!==k);
  const all={};for(const[dd]of DIVS){const br=S.brackets[dd];if(br)for(const mm of br.matches)all[dd+':'+mm.id]=mm}
  let i=seq[c].findIndex(y=>all[y]&&all[y].est>m.est);if(i<0)i=seq[c].length;seq[c].splice(i,0,k);scheduleAll();
}
// n팀을 M(2의 거듭제곱) + e팀으로 나눔. pre = 예선 e경기 후 M강, post = M강(1라운드) 후 2라운드에서 e팀 합류
function planOf(n){let M=1;while(M*2<=n)M*=2;const e=n-M;return{M,e,postOk:e>0&&e<=M/2}}
function genBracket(div,start,avgMin,courts,mode){
  const ids=shuffle(S.teams.filter(t=>t.div===div).map(t=>t.id));
  const n=ids.length,{M,e,postOk}=planOf(n);
  if(mode==='post'&&!postOk)mode='pre';
  const br={start,avgMin,courts,mode:e?mode:'plain',confirmed:false,created:Date.now(),matches:[],names:[]};
  const put=(m,s,src)=>{if(src.t)m['t'+s]=src.t;else{m['f'+s]=src.m;byId(br,src.m).next=m.id}};
  const mk=(r,o)=>{const m={id:uid(),r,ta:null,tb:null,fa:null,fb:null,next:null,a:null,b:null,bye:false,sets:[],sa:0,sb:0,winner:null,actStart:null,actEnd:null,court:null,no:null,refs:{},plan:null};
    br.matches.push(m);put(m,'a',o[0]);put(m,'b',o[1]);return{m:m.id}};
  const build=(src,r)=>{while(src.length>1){const nx=[];for(let i=0;i<src.length;i+=2)nx.push(mk(r,[src[i],src[i+1]]));src=nx;r++}};
  const std=L=>{const a=[];for(;L>=2;L/=2)a.push(L===2?'결승':L===4?'준결승':L+'강');return a};
  const brev=k=>{const bits=Math.round(Math.log2(k));return Array.from({length:k},(_,i)=>{let x=0;for(let b=0;b<bits;b++)if(i>>b&1)x|=1<<(bits-1-b);return x})};
  let k=0;const T=()=>({t:ids[k++]});
  if(!e){build(Array.from({length:n},T),0);br.names=std(M)}
  else if(mode==='pre'){const pos=new Set(brev(M).slice(0,e));const src=[];for(let i=0;i<M;i++)src.push(pos.has(i)?mk(0,[T(),T()]):T());build(src,1);br.names=['예선',...std(M)]}
  else{const W=[];for(let i=0;i<M/2;i++)W.push(mk(0,[T(),T()]));const pos=new Set(brev(M/2).slice(0,e));build(W.map((w,i)=>pos.has(i)?mk(1,[T(),w]):w),2);br.names=[`1라운드 · ${M}강`,`2라운드 · ${e}팀 합류`,...std(M/2)]}
  br.rounds=Math.max(...br.matches.map(m=>m.r))+1;br.names.length=br.rounds;br.names[br.rounds-1]='결승';
  resolve(br);number(br);
  return br;
}

// 세트 점수 규칙: 일반 세트 21점(2점 차, 듀스 최대 30점), 마지막 세트 15점(2점 차)

function setCheck(x,y,final){const R=rules(),t=final?R.fpts:R.pts,cap=final?R.fcap:R.cap,w=Math.max(x,y),l=Math.min(x,y);
  if(cap&&w>cap)return `최대 ${cap}점을 넘을 수 없어요`;
  if(w<t)return `${t}점을 먼저 내야 이겨요`;
  if(w===t)return l<=t-2?'':`${t-1}:${t-1} 이후에는 2점을 앞서야 이겨요`;
  if(cap&&w===cap&&l===cap-1)return '';
  if(w-l===2)return '';
  return w-l<2?'2점을 앞서야 끝나요':`${t}점을 넘긴 세트는 2점 차로만 끝나요`}

/* ---------- officials logic ---------- */
function refArr(m,k){const c=(S.settings.roles.find(r=>r.k===k)||{c:0}).c;if(!m.refs)m.refs={};let a=m.refs[k];if(!Array.isArray(a))a=a?[a]:[];while(a.length<c)a.push('');m.refs[k]=a;return a}
const staffOk=()=>S.staff.filter(p=>p.approved);
const staffName=id=>{const p=S.staff.find(x=>x.id===id);return p?p.name:''};
function eachMatch(fn){for(const[d]of DIVS){const br=S.brackets[d];if(!br)continue;for(const m of br.matches)if(!m.bye&&!((m.wo||m.dead)&&!m.winner))fn(d,br,m)}}
function assignedIn(m,pid){return roles().some(r=>refArr(m,r.k).includes(pid))||(m.setRefs?Object.values(m.setRefs).some(o=>Object.values(o).some(a=>a.includes(pid))):false)}
// 세트별 교체: 기본 배정(모든 세트)에 세트마다 덮어쓰기
function refFor(m,s,k){const o=m.setRefs&&m.setRefs[s]&&m.setRefs[s][k];return o||refArr(m,k)}
function setRefDiff(m){const out=[];if(!m.setRefs)return out;
  for(const s of Object.keys(m.setRefs).map(Number).sort((a,b)=>a-b))for(const r of roles()){const b=refArr(m,r.k),o=m.setRefs[s][r.k];if(o)o.forEach((id,k)=>{if(id!==b[k])out.push({s,r,from:b[k],to:id})})}
  return out}
function setRefHtml(m){const d=setRefDiff(m);if(!d.length)return '';const by={};for(const x of d)(by[x.s]=by[x.s]||[]).push(`${esc(x.r.n)} ${esc(staffName(x.from)||'-')} → <b>${esc(staffName(x.to)||'비움')}</b>`);
  return `<div class="sref-list">${Object.keys(by).map(s=>`<div><span class="role-tag">${s}세트</span> ${by[s].join(', ')}</div>`).join('')}</div>`}
function loadOf(pid){let n=0;eachMatch((d,br,m)=>{if(assignedIn(m,pid))n++});return n}
function issuesFor(p,d,br,m,role){
  const out=[];
  if(!p.approved)out.push('승인 전');
  if(p.off)out.push('배정 중지');
  for(const b of p.blocks||[])if(m.est<b.e&&b.s<m.estEnd){out.push('불가 시간');break}
  if(p.roles.length&&!p.roles.includes(role))out.push(roleN(role)+' 불가');
  if(p.divs.length&&!p.divs.includes(d))out.push(DN[d]+' 제외');
  if(p.exclude.includes(d+'-'+m.no))out.push('제외 경기');
  if(p.days&&p.days.length&&!p.days.includes(dayKey(m.est)))out.push(dayName(m.est)+' 불가');
  if(p.ex&&p.ex.from&&p.ex.to&&(!p.ex.day||p.ex.day===dayKey(m.est))&&minOf(m.est)<hm(p.ex.to)&&minOf(m.estEnd)>hm(p.ex.from))out.push(p.ex.from+'~'+p.ex.to+' 제외');
  const f=hm(p.from),t=hm(p.to);
  if(f!=null&&minOf(m.est)<f)out.push(p.from+' 이후 가능');
  if(t!=null&&minOf(m.estEnd)>t)out.push(p.to+' 이전만 가능');
  if(S.settings.avoidOwnSchool&&p.school&&[m.a,m.b].some(id=>id&&norm(teamName(id))===norm(p.school)))out.push('소속 학교 경기');
  let clash=false;eachMatch((d2,br2,m2)=>{if(m2.id!==m.id&&assignedIn(m2,p.id)&&m2.est<m.estEnd&&m.est<m2.estEnd)clash=true});
  if(clash)out.push('같은 시간 다른 경기');
  if(p.max>0&&!assignedIn(m,p.id)&&loadOf(p.id)>=p.max)out.push('최대 '+p.max+'경기 초과');
  return out;
}
function doAssign(mode){
  if(!staffOk().length){toast('승인된 심판·운영진이 없어요');return}
  const r=autoAssign(ui.refDiv||'all',mode);save();render();
  toast(`${r.matches}경기에 ${r.filled}자리 배정${r.empty?` · ${r.empty}자리는 조건에 맞는 사람이 없어 비워 뒀어요`:''}`);
}
function conflicts(){const out=[];eachMatch((d,br,m)=>{if(m.winner||isLive(m))return;for(const r of roles())refArr(m,r.k).forEach((id,k)=>{if(!id)return;const p=S.staff.find(x=>x.id===id);if(!p)return;const iss=issuesFor(p,d,br,m,r.k);if(iss.length)out.push({m,r:r.k,k,txt:`${DN[d]} ${m.no}경기 ${r.n} ${p.name}(${iss[0]})`})})});return out}
function autoAssign(scope,mode){
  const list=[];eachMatch((d,br,m)=>{if((scope==='all'||scope===d)&&!m.winner)list.push({d,br,m})});
  list.sort((a,b)=>a.m.est-b.m.est);
  if(mode==='all')for(const x of list)if(!x.m.actStart){for(const r of roles())refArr(x.m,r.k).fill('');delete x.m.setRefs}
  const load={};for(const p of S.staff)load[p.id]=loadOf(p.id);
  let filled=0,empty=0;
  for(const x of list)for(const r of roles()){
    const arr=refArr(x.m,r.k);
    for(let k=0;k<arr.length;k++){
      if(arr[k])continue;
      const c=staffOk().filter(p=>!assignedIn(x.m,p.id)&&issuesFor(p,x.d,x.br,x.m,r.k).length===0);

  $('#tabs').innerHTML=TABS.map(([k,n])=>`<button class="tab" data-act="tab" data-k="${k}" aria-current="${ui.tab===k?'page':'false'}">${n}${k==='admin'&&ui.admin?' ●':''}</button>`).join('');

   $('#bnav').innerHTML=it('bracket','🏆','대진표')+it('board','📺','현황판')+it('status','📋','참가 현황')+it('apply','📝','참가 신청')+`<button data-act="menu" aria-current="${more?'page':'false'}"><span class="bi">☰</span><span>${more?({mine:'신청 확인',ref:'심판·운영',admin:'관리자'})[ui.tab]:'더보기'}</span></button>`}

// 화면이 조금 좁으면 대진표를 살짝 줄여 한 화면에 (80%까지), 그보다 좁으면 옆으로 넘기기
function fitBrackets(){
  // 세로 대진표: 학교 이름이 잘리는 칸만 세트별 점수를 숨겨서 이름이 보이게 (세트 스코어는 그대로)
  for(const box of document.querySelectorAll('.vbox')){box.classList.remove('nopts');
    if([...box.querySelectorAll('.vsl .nm')].some(n=>n.scrollWidth>n.clientWidth+1))box.classList.add('nopts')}
  for(const w of document.querySelectorAll('.bracket-wrap:not(.vwrap)')){const inner=w.firstElementChild;if(!inner)continue;inner.style.zoom='';const need=inner.scrollWidth,have=w.clientWidth;inner.style.zoom=need>have?String(Math.max(.8,(have-2)/need)):''}}
window.addEventListener('resize',()=>{clearTimeout(window.__fitT);window.__fitT=setTimeout(fitBrackets,120)});
function go(tab){ui.tab=tab;if(tab!=='bracket'){ui.swap=false;ui.sel=null}try{history.replaceState(null,'','#'+tab)}catch(e){}render();window.scrollTo(0,0)}

const MAXDAYS=4;
function schedFields(){const c=schedCfg();
  const tabs=Array.from({length:MAXDAYS},(_,i)=>`<button type="button" class="dtab${i===0?' on':''}" data-act="sched-tab" data-k="${i}">${i+1}일차<small id="g-lab${i}">${c.days[i]?fmtD(Date.parse(c.days[i]+'T12:00')):'안 함'}</small></button>`).join('');
  const panes=Array.from({length:MAXDAYS},(_,i)=>{const k=dayCfg(i);return `<div class="dpane" id="g-p${i}"${i?' hidden':''}><div class="fields">
    <label class="f">${i+1}일차 날짜${i?' (안 하면 비우기)':''}<input type="date" id="g-d${i}" value="${esc(c.days[i]||'')}" data-i="${i}" class="g-date"></label>
    <label class="f">첫 경기 시각<input type="time" id="g-st${i}" value="${esc(c.days[i]?k.start:(dayCfg(0).start))}"></label>
    <label class="f">마지막 경기 끝나는 시각 (비우면 제한 없음)<input type="time" id="g-en${i}" value="${esc(c.days[i]?k.end:'')}"></label>
    <label class="f">점심 시작 (없으면 비우기)<input type="time" id="g-ls${i}" value="${esc(c.days[i]?k.lunchFrom:'')}"></label>
    <label class="f">점심 끝<input type="time" id="g-le${i}" value="${esc(c.days[i]?k.lunchTo:'')}"></label></div>
    ${i?'':`<div class="row"><button type="button" class="btn small" data-act="sched-copy">1일차 시각을 다른 날에도 똑같이</button></div>`}</div>`}).join('');
  return `<div class="dtabs">${tabs}</div>${panes}
    <div class="fields"><label class="f">경기당 평균 시간 (분)<input type="number" id="g-avg" min="10" max="180" value="${c.avg}"></label>
    <label class="f">경기 사이 쉬는 시간 (분)<input type="number" id="g-gap" min="0" max="60" value="${c.gap||0}"></label></div>
    <p class="sub" style="margin:0">날짜를 넣은 날까지만 일정을 짜요. 끝나는 시각을 비운 날이 있으면 경기를 날짜별로 고르게 나눠요.</p>`}
function readSched(){
  const days=[],dayCfgs=[];let gapDay=false;
  for(let i=0;i<MAXDAYS;i++){const d=$('#g-d'+i).value;if(!d){gapDay=true;continue}
    if(gapDay)return `${i+1}일차 앞의 날짜가 비어 있어요. 1일차부터 차례로 넣어 주세요.`;
    if(days.length&&d<=days[days.length-1])return `${i+1}일차 날짜는 ${i}일차 뒤여야 해요.`;
    const st=$('#g-st'+i).value,en=$('#g-en'+i).value,ls=$('#g-ls'+i).value,le=$('#g-le'+i).value;
    if(!st)return `${i+1}일차 첫 경기 시각을 넣어 주세요.`;
    if(en&&hm(en)<=hm(st))return `${i+1}일차 끝나는 시각이 시작보다 늦어야 해요.`;
    if((ls&&!le)||(!ls&&le)||(ls&&le&&hm(le)<=hm(ls)))return `${i+1}일차 점심시간은 시작과 끝을 함께 넣거나 둘 다 비워 주세요.`;
    days.push(d);dayCfgs.push({start:st,end:en,lunchFrom:ls,lunchTo:le})}
  if(!days.length)return '1일차 날짜를 넣어 주세요.';
  const avg=Number($('#g-avg').value);if(!(avg>=10&&avg<=180))return '평균 시간은 10~180분 사이로 입력하세요.';
  const gp=Math.max(0,Math.min(60,Number($('#g-gap').value)||0));
  S.settings.sched={days,dayCfg:dayCfgs,start:dayCfgs[0].start,end:'',lunchFrom:'',lunchTo:'',avg,gap:gp};return ''}
function openGen(all){

const nextOf=(br,m)=>byId(br,m.next);
const MEDAL={g:{e:'🥇',n:'우승'},s:{e:'🥈',n:'준우승'},b:{e:'🥉',n:'3위'}};
// 결승 승자=금, 결승 패자=은, 준결승 패자=동(3·4위전 없이 공동 3위)
function medalOf(br,m,id){
  if(!id||!m.winner)return null;
  if(!m.next)return m.winner===id?'g':'s';
  const par=byId(br,m.next);
  if(par&&!par.next&&m.winner!==id)return 'b';
  return null;
}
function podiumHtml(br){
  const fin=br.matches.find(m=>!m.next);if(!fin||!fin.winner)return '';
  const lose=m=>m.winner===m.a?m.b:m.a;
  const third=br.matches.filter(m=>m.next===fin.id&&m.winner&&lose(m)).map(lose);
  const card=(k,ids)=>`<div class="pod md-${k}"><span class="pod-e">${MEDAL[k].e}</span><span class="pod-n">${MEDAL[k].n}</span><b>${ids.map(i=>`<span>${esc(teamName(i))}</span>`).join('')}</b></div>`;
  return `<div class="podium">${card('g',[fin.winner])}${lose(fin)?card('s',[lose(fin)]):''}${third.length?card('b',third):''}</div>`;
}

// 예시 진행: 주어진 시각까지 앞 경기들은 끝나고, 코트마다 1경기씩 진행 중
function simulateDemo(simNow){
  const avg=schedCfg().avg*60000;
  const pair=(t)=>{if(Math.random()<.2){const k=t-1+Math.floor(Math.random()*3);return[k+2,k]}return[t,Math.floor(t*.35)+Math.floor(Math.random()*Math.floor(t*.55))]};
  const mkSets=()=>{const three=Math.random()<.35,W=()=>pair(21),L=()=>pair(21).reverse();
    if(!three)return Math.random()<.5?[W(),W()]:[L(),L()];
    const aw=Math.random()<.5,f=pair(15);return aw?[W(),L(),f]:[L(),W(),f.slice().reverse()]};
  for(let g=0;g<80;g++){
    scheduleAll();
    let pick=null;for(const br of Object.values(S.brackets))for(const m of br.matches)if(!m.actStart&&!m.winner&&!m.wo&&!m.dead&&m.a&&m.b&&(!pick||m.est<pick.est))pick=m;
    if(!pick||pick.est>=simNow)break;
    pick.actStart=pick.est;
    const dur=avg+(Math.floor(Math.random()*13)-8)*60000;
    if(pick.est+avg<=simNow||pick.est+dur<=simNow){const st=mkSets();pick.sets=st;pick.sa=st.filter(x=>x[0]>x[1]).length;pick.sb=st.length-pick.sa;pick.winner=pick.sa>pick.sb?pick.a:pick.b;pick.actEnd=Math.min(pick.est+dur,simNow-60000)}
  }
}
